{% extends "dashboard.html" %}
{% block title %}Nuevo Reporte | VANT-SIEM{% endblock %}
{% block content %}
    <div class="flex justify-center">
        <div class="w-full max-w-2xl">
            <div class="glass-card">
                <div class="px-6 py-4 border-b dark:border-surface-700 border-surface-200 text-center text-brand-400 font-bold">
                    <i class="fas fa-file-alt mr-2"></i>Nuevo Reporte de Incidente
                </div>
                <div class="p-6">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="nombre_informante" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
                                <i class="fas fa-user mr-1"></i>Nombre del Informante
                            </label>
                            <input type="text" name="nombre_informante" id="nombre_informante" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required value="{{ form.nombre_informante.value|default_if_none:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="email_informante" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
                                <i class="fas fa-envelope mr-1"></i>Email del Informante
                            </label>
                            <input type="email" name="email_informante" id="email_informante" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required value="{{ form.email_informante.value|default_if_none:'' }}">
                        </div>
                        <div class="mb-3">
                            <label for="area" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
                                <i class="fas fa-building mr-1"></i>Área
                            </label>
                            <select name="area" id="area" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required>
                                {% for area in areas %}
                                    <option value="{{ area.id }}" {% if form.area.value|stringformat:"s" == area.id|stringformat:"s" %}selected{% endif %}>{{ area.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
                                <i class="fas fa-align-left mr-1"></i>Descripción
                            </label>
                            <textarea name="descripcion" id="descripcion" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" rows="4" required>{{ form.descripcion.value|default_if_none:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="estado_solucion" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
                                <i class="fas fa-tasks mr-1"></i>Estado
                            </label>
                            <select name="estado_solucion" id="estado_solucion" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required>
                                {% for valor, texto in reporte_estado_choices %}
                                    <option value="{{ valor }}" {% if form.estado_solucion.value == valor %}selected{% endif %}>{{ texto }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <button type="submit" class="w-full px-4 py-2.5 bg-gradient-to-r from-brand-600 to-brand-500 text-white rounded-xl font-medium mt-3">
                            <i class="fas fa-save mr-2"></i>Guardar Reporte
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
