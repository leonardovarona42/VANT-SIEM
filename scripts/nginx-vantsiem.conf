# VANT-SIEM Microservices — Nginx Gateway Configuration
# Deploy to: /etc/nginx/sites-enabled/vantsiem

upstream auth_service {
    server 127.0.0.1:8100;
    keepalive 10;
}

upstream web_service {
    server 127.0.0.1:8200;
    keepalive 10;
}

upstream inventory_service {
    server 127.0.0.1:8300;
    keepalive 10;
}

upstream logs_service {
    server 127.0.0.1:8400;
    keepalive 10;
}

upstream soc_service {
    server 127.0.0.1:8500;
    keepalive 10;
}

upstream bus_service {
    server 127.0.0.1:8600;
    keepalive 5;
}

upstream intelligence_service {
    server 127.0.0.1:8700;
    keepalive 10;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_agent:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=api_user:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ingest:10m rate=50r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/ssl/vsiem.pem;
    ssl_certificate_key /etc/nginx/ssl/vsiem.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers (SEC-06)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    client_max_body_size 50M;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    # === AUTH SERVICE ===
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === INVENTORY SERVICE (Agent API) ===
    location /inventory/api/ {
        limit_req zone=api_agent burst=50 nodelay;
        proxy_pass http://inventory_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === LOGS SERVICE (Agent Ingest) ===
    location /logs/api/ingest/ {
        limit_req zone=ingest burst=100 nodelay;
        proxy_pass http://logs_service/api/ingest/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /logs/api/ {
        limit_req zone=api_agent burst=30 nodelay;
        proxy_pass http://logs_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === SOC SERVICE (DLP + Bitacora + CMDB) ===
    location /soc/api/agent/ {
        limit_req zone=api_agent burst=30 nodelay;
        proxy_pass http://soc_service/api/agent/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /soc/api/ {
        limit_req zone=api_user burst=20 nodelay;
        proxy_pass http://soc_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /soc/ {
        limit_req zone=api_user burst=10 nodelay;
        proxy_pass http://soc_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === BUS SERVICE ===
    location /api/alerts/ {
        proxy_pass http://bus_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/events/recent/ {
        proxy_pass http://bus_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === WEB SERVICE (Dashboard) ===
    location /static/ {
        alias /home/vant-siem/staticfiles/;
        expires 30d;
    }

    location /media/ {
        alias /home/vant-siem/media/;
    }

    location /siem/ {
        limit_req zone=api_user burst=10 nodelay;
        proxy_pass http://web_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /eventos/ {
        limit_req zone=api_user burst=10 nodelay;
        proxy_pass http://web_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /inventory/ {
        limit_req zone=api_user burst=10 nodelay;
        proxy_pass http://web_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://web_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === INTELLIGENCE SERVICE ===
    location /intel/api/ {
        limit_req zone=api_user burst=20 nodelay;
        proxy_pass http://intelligence_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
