agent:
  id: "agent-ad-01"
  host_name: "windows-server-ad"
  interval_seconds: 15

output:
  endpoint: "http://192.168.1.12:9201/api/v1/events/bulk"
  source_endpoint: "http://192.168.1.12:9201/api/v1/sources/upsert"
  timeout_seconds: 10
  auth:
    mode: "none"   # none|basic|token
    username: ""
    password: ""
    token: ""
  tls:
    enabled: false
    verify: false
    ca_cert: ""

collectors:
  snort:
    enabled: false
    path: "C:/snort/log/alert"
    start_position: "end"
    max_lines_per_cycle: 400
  suricata:
    enabled: false
    path: "C:/suricata/logs/eve.json"
    start_position: "end"
    max_lines_per_cycle: 600
  windows_eventlog:
    enabled: true
    channel: "Security"
  postgres:
    enabled: false
    path: "C:/Program Files/PostgreSQL/16/data/log/postgresql.log"
    start_position: "end"
    max_lines_per_cycle: 400
