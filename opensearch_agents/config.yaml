agent:
  id: "agent-001"
  host_name: "windows-host-01"
  interval_seconds: 10

output:
  endpoint: "http://192.168.12.43:9201/api/v1/events/bulk"
  source_endpoint: "http://192.168.12.43:9201/api/v1/sources/upsert"
  timeout_seconds: 10
  auth:
    mode: "none"   # none|basic|token
    username: ""
    password: ""
    token: ""
  tls:
    enabled: false
    verify: false
    ca_cert: ""

control:
  server_url: "http://192.168.12.43:8000"
  require_https: false
  token: ""
  poll_seconds: 30
  inventory_seconds: 86400
  dlp_poll_seconds: 900
  dlp_scan_seconds: 900

asset_audit:
  enabled: true

aegis_dlp:
  enabled: true
  max_file_size_mb: 10
  scan_paths: []
  monitored_extensions:
    - ".txt"
    - ".log"
    - ".csv"
    - ".json"
    - ".xml"
    - ".md"
    - ".docx"
    - ".xlsx"
    - ".pptx"
    - ".pdf"

collectors:
  snort:
    enabled: true
    path: "C:/Snort/log/alerts.fast"
    start_position: "beginning"   # beginning|end
    max_lines_per_cycle: 400
  suricata:
    enabled: true
    path: "C:/suricata-log/eve.json"
    start_position: "beginning"   # beginning|end
    max_lines_per_cycle: 600
  windows_eventlog:
    enabled: false
    channel: "Security"
    channels:
      - "Security"
      - "System"
      - "Application"
  postgres:
    enabled: false
    path: "C:/Program Files/PostgreSQL/16/data/log/postgresql.log"
    start_position: "end"   # beginning|end
    max_lines_per_cycle: 400
  file_logs:
    enabled: true
    items:
      - enabled: true
        source_name: "samba-auth"
        path: "/var/log/samba/01_autenticaciones.log"
        event_category: "samba.auth"
        severity: "info"
        tags: ["samba", "ad", "audit", "auth"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-user-mod"
        path: "/var/log/samba/02_modificaciones_usuarios.log"
        event_category: "samba.user.modify"
        severity: "info"
        tags: ["samba", "ad", "audit", "user", "modify"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-password-change"
        path: "/var/log/samba/03_cambios_contrasenas.log"
        event_category: "samba.password"
        severity: "info"
        tags: ["samba", "ad", "audit", "password"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-auth-fail"
        path: "/var/log/samba/04_intentos_fallidos.log"
        event_category: "samba.auth.fail"
        severity: "warning"
        tags: ["samba", "ad", "audit", "auth", "failed"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-group-change"
        path: "/var/log/samba/05_cambios_grupos.log"
        event_category: "samba.group"
        severity: "info"
        tags: ["samba", "ad", "audit", "group"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-domain-policy"
        path: "/var/log/samba/06_politicas_dominio.log"
        event_category: "samba.domain.policy"
        severity: "info"
        tags: ["samba", "ad", "audit", "policy"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-ldap"
        path: "/var/log/samba/07_operaciones_ldap.log"
        event_category: "samba.ldap"
        severity: "info"
        tags: ["samba", "ad", "audit", "ldap"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-kerberos"
        path: "/var/log/samba/08_tickets_kerberos.log"
        event_category: "samba.kerberos"
        severity: "info"
        tags: ["samba", "ad", "audit", "kerberos"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
