agent:
  id: "agent-debian-01"
  host_name: "debian-host"
  interval_seconds: 10
  log_level: "INFO"
  log_file: "/var/log/vant-siem/agent.log"
  log_max_bytes: 10485760
  log_backup_count: 5
  log_every_cycles: 60

output:
  endpoint: "http://192.168.12.43:9201/api/v1/events/bulk"
  source_endpoint: "http://192.168.12.43:9201/api/v1/sources/upsert"
  timeout_seconds: 10
  auth:
    mode: "none"   # none|basic|token
    username: ""
    password: ""
    token: ""
  tls:
    enabled: false
    verify: false
    ca_cert: ""

control:
  server_url: "http://192.168.12.43:8000"
  require_https: false
  token: ""
  poll_seconds: 30
  inventory_seconds: 86400

aegis_dlp:
  enabled: true
  scan_paths:
    - "/home"
    - "/root"
    - "/srv"
    - "/var/www"
    - "/mnt"
    - "/media"
  monitored_extensions:
    - ".txt"
    - ".csv"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".pdf"
    - ".rtf"
    - ".odt"
    - ".ods"
    - ".odp"
    - ".conf"
    - ".ini"
    - ".json"
    - ".xml"
    - ".log"
    - ".md"
  max_file_size_mb: 25

collectors:
  snort:
    enabled: false
    path: "/var/log/snort/alert"
    start_position: "end"
    max_lines_per_cycle: 400
  suricata:
    enabled: false
    path: "/var/log/suricata/eve.json"
    start_position: "end"
    max_lines_per_cycle: 600
  windows_eventlog:
    enabled: false
    channel: "Security"
  postgres:
    enabled: false
    path: "/var/log/postgresql/postgresql-16-main.log"
    start_position: "end"
    max_lines_per_cycle: 400
  file_logs:
    enabled: true
    items:
      - enabled: true
        source_name: "samba-audit"
        path: "/var/log/samba/audit.log"
        event_category: "samba.audit"
        severity: "info"
        tags: ["samba", "ad", "audit"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-autenticaciones"
        path: "/var/log/samba/01_autenticaciones.log"
        event_category: "samba.autenticaciones"
        severity: "info"
        tags: ["samba", "ad", "auth"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-modificaciones-usuarios"
        path: "/var/log/samba/02_modificaciones_usuarios.log"
        event_category: "samba.modificaciones_usuarios"
        severity: "info"
        tags: ["samba", "ad", "users"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-cambios-contrasenas"
        path: "/var/log/samba/03_cambios_contrasenas.log"
        event_category: "samba.cambios_contrasenas"
        severity: "info"
        tags: ["samba", "ad", "passwords"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-intentos-fallidos"
        path: "/var/log/samba/04_intentos_fallidos.log"
        event_category: "samba.intentos_fallidos"
        severity: "warning"
        tags: ["samba", "ad", "auth", "failed"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-cambios-grupos"
        path: "/var/log/samba/05_cambios_grupos.log"
        event_category: "samba.cambios_grupos"
        severity: "info"
        tags: ["samba", "ad", "groups"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-politicas-dominio"
        path: "/var/log/samba/06_politicas_dominio.log"
        event_category: "samba.politicas_dominio"
        severity: "info"
        tags: ["samba", "ad", "policies"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-operaciones-ldap"
        path: "/var/log/samba/07_operaciones_ldap.log"
        event_category: "samba.operaciones_ldap"
        severity: "info"
        tags: ["samba", "ad", "ldap"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-tickets-kerberos"
        path: "/var/log/samba/08_tickets_kerberos.log"
        event_category: "samba.tickets_kerberos"
        severity: "info"
        tags: ["samba", "ad", "kerberos"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-todo"
        path: "/var/log/samba/99_todo.log"
        event_category: "samba.todo"
        severity: "info"
        tags: ["samba", "ad"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-log-samba"
        path: "/var/log/samba/log.samba"
        event_category: "samba.log"
        severity: "info"
        tags: ["samba", "daemon"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-log-smbd"
        path: "/var/log/samba/log.smbd"
        event_category: "samba.smbd"
        severity: "info"
        tags: ["samba", "smbd"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-log-winbindd"
        path: "/var/log/samba/log.winbindd"
        event_category: "samba.winbindd"
        severity: "info"
        tags: ["samba", "winbindd"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-log-winbindd-idmap"
        path: "/var/log/samba/log.winbindd-idmap"
        event_category: "samba.winbindd_idmap"
        severity: "info"
        tags: ["samba", "winbindd"]
        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "samba-log-wb-DTCM"
        path: "/var/log/samba/log.wb-DTCM"
        event_category: "samba.wb"
        severity: "info"
