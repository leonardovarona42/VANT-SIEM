        start_position: "end"
        max_lines_per_cycle: 400
      - enabled: true
        source_name: "auth-log"
        path: "/var/log/auth.log"
        event_category: "linux.auth"
        severity: "info"
        tags: ["linux", "auth"]
        start_position: "end"
        max_lines_per_cycle: 300
