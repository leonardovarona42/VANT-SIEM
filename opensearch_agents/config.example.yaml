agent:
  id: "agent-001"
  host_name: "windows-host-01"
  interval_seconds: 10
  log_level: "INFO"
  log_file: "/var/log/vant-siem/agent.log"
  log_max_bytes: 10485760
  log_backup_count: 5
  log_every_cycles: 60

output:
  endpoint: "http://192.168.12.43:9201/api/v1/events/bulk"
  source_endpoint: "http://192.168.12.43:9201/api/v1/sources/upsert"
  timeout_seconds: 10
  auth:
    mode: "none"   # none|basic|token
    username: ""
    password: ""
    token: ""
  tls:
    enabled: false
    verify: false
    ca_cert: ""

control:
  server_url: "http://192.168.12.43:8000"
  require_https: false
  token: ""
  poll_seconds: 30
  inventory_seconds: 86400
  dlp_poll_seconds: 900
  dlp_scan_seconds: 900

asset_audit:
  enabled: true

aegis_dlp:
  enabled: true
  scan_paths:
    - "/home"
    - "/root"
    - "/srv"
    - "/var/www"
    - "/mnt"
    - "/media"
  monitored_extensions:
    - ".txt"
    - ".csv"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".ppt"
    - ".pptx"
    - ".pdf"
    - ".rtf"
    - ".odt"
    - ".ods"
    - ".odp"
    - ".conf"
    - ".ini"
    - ".json"
    - ".xml"
    - ".log"
    - ".md"
  max_file_size_mb: 25

collectors:
  snort:
    enabled: false
    path: "C:/snort/log/alert"
    start_position: "end"   # beginning|end
    max_lines_per_cycle: 400
  suricata:
    enabled: false
    path: "C:/suricata/logs/eve.json"
    start_position: "end"   # beginning|end
    max_lines_per_cycle: 600
  windows_eventlog:
    enabled: false
    channel: "Security"
    channels:
      - "Security"
      - "System"
      - "Application"
  postgres:
    enabled: false
    path: "C:/Program Files/PostgreSQL/16/data/log/postgresql.log"
    start_position: "end"   # beginning|end
    max_lines_per_cycle: 400
  file_logs:
    enabled: true
    items:
      - enabled: true
        source_name: "samba-audit"
        path: "/var/log/samba/audit.log"
        event_category: "samba.audit"
        severity: "info"
        tags: ["samba", "ad", "audit"]
        start_position: "end"   # beginning|end
        max_lines_per_cycle: 400
