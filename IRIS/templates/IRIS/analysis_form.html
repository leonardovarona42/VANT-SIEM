{% extends 'dashboard.html' %}
{% load static %}

{% block title %}Ejecutar Análisis de IA{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card bg-secondary">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">
                        <i class="fas fa-play"></i> Ejecutar Análisis de IA
                    </h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="hours_back" class="form-label text-light">Horas hacia atrás para analizar:</label>
                            <input type="number" class="form-control" id="hours_back" name="hours_back" value="24" min="1" max="168" required>
                            <div class="form-text text-light">Máximo 7 días (168 horas)</div>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-play"></i> Ejecutar Análisis
                        </button>
                        <a href="{% url 'iris:iris_dashboard' %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Volver al Dashboard
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
