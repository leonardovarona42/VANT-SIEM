{% extends "web_app/base.html" %}
{% block title %}{{ title }} | VANT-SIEM Web{% endblock %}

{% block content %}
<div class="mb-6">
  <a href="{% url 'web:policies-list' %}" class="text-sm dark:text-surface-400 text-surface-500 hover:text-brand-400 transition-colors"><i class="fas fa-arrow-left mr-1"></i>Volver a políticas</a>
</div>

<div class="glass-card p-6 max-w-2xl">
  <h1 class="text-xl font-bold dark:text-white text-surface-900 mb-6">{{ title }}</h1>

  <form method="post" class="space-y-5">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Nombre</label>
      <input type="text" name="name" value="{{ policy.name|default:'' }}" class="w-full px-4 py-3 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent" required>
    </div>

    {% if not policy %}
    <div>
      <label class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Código</label>
      <input type="text" name="code" value="" class="w-full px-4 py-3 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent font-mono" placeholder="Ej: DLP-FIN-001" required>
    </div>
    {% endif %}

    <div>
      <label class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Descripción</label>
      <textarea name="description" rows="4" class="w-full px-4 py-3 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent">{{ policy.description|default:"" }}</textarea>
    </div>

    <div class="flex items-center gap-3">
      <input type="checkbox" name="is_active" id="is_active" class="w-4 h-4 rounded dark:bg-surface-800 dark:border-surface-700 text-brand-500 focus:ring-brand-500" {% if policy.is_active or not policy %}checked{% endif %}>
      <label for="is_active" class="text-sm dark:text-surface-300 text-surface-600">Activa</label>
    </div>

    <div class="flex gap-3 pt-4">
      <button type="submit" class="btn-primary text-sm"><i class="fas fa-save mr-2"></i>{% if policy %}Guardar Cambios{% else %}Crear Política{% endif %}</button>
      <a href="{% url 'web:policies-list' %}" class="btn-secondary text-sm">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
