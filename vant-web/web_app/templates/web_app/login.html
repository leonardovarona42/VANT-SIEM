{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANT-SIEM | Login</title>
  <script>
    (function() {
      const saved = localStorage.getItem("vant-theme");
      if (saved === "light") { document.documentElement.classList.remove("dark"); }
      else if (saved === "dark") { document.documentElement.classList.add("dark"); }
      else if (window.matchMedia("(prefers-color-scheme: light)").matches) { document.documentElement.classList.remove("dark"); }
      else { document.documentElement.classList.add("dark"); }
    })();
  </script>
  <script src="{% static 'js/tailwind.min.js' %}"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: { 50:"#f0f9ff",100:"#e0f2fe",200:"#bae6fd",300:"#7dd3fc",400:"#38bdf8",500:"#0ea5e9",600:"#0284c7",700:"#0369a1",800:"#075985",900:"#0c4a6e",950:"#082f49" },
            surface: { 50:"#f8fafc",100:"#f1f5f9",200:"#e2e8f0",300:"#cbd5e1",400:"#94a3b8",500:"#64748b",600:"#475569",700:"#334155",800:"#1e293b",900:"#0f172a",950:"#020617" },
            accent: { 400:"#22d3ee",500:"#06b6d4",600:"#0891b2" },
          },
          fontFamily: { sans: ["Inter","system-ui","-apple-system","sans-serif"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/inter.css' %}" />
  <link rel="stylesheet" href="{% static 'css/fontawesome-all.min.css' %}" />
  <style type="text/tailwindcss">
    @layer base { html { font-family: "Inter",system-ui,sans-serif; scroll-behavior:smooth; } body { @apply dark:bg-surface-950 dark:text-surface-200 bg-surface-50 text-surface-800 antialiased; } }
    @layer components {
      .glass-card { @apply dark:bg-surface-900/60 dark:border-surface-800/50 dark:shadow-black/20 bg-white/80 border-surface-200/50 backdrop-blur-xl rounded-2xl shadow-lg; }
      .input-field { @apply w-full px-4 py-3 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all duration-200; }
      .btn-login { @apply w-full px-4 py-3 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all duration-300; }
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }
    .animate-fadeIn { animation: fadeIn 1s ease-out; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-brand-500/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-accent-500/10 rounded-full blur-3xl"></div>
  </div>

  <button id="theme-toggle" class="fixed top-4 right-4 z-50 p-3 rounded-xl dark:bg-surface-800 bg-surface-200 dark:text-surface-300 text-surface-600 hover:dark:bg-surface-700 hover:bg-surface-300 transition-all duration-200" onclick="toggleTheme()" title="Cambiar tema">
    <i class="fas fa-sun text-amber-400 dark:hidden"></i>
    <i class="fas fa-moon text-brand-500 hidden dark:inline"></i>
  </button>

  <div class="glass-card w-full max-w-md p-8 animate-fadeIn relative">
    <div class="flex justify-center mb-6">
      <div class="relative">
        <div class="absolute inset-0 bg-accent-500/20 rounded-2xl blur-xl"></div>
        <img src="{% static 'img/logo.png' %}" alt="VANT-SIEM Logo" class="relative w-24 h-24 rounded-full object-cover" />
      </div>
    </div>
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-brand-400 to-accent-400 bg-clip-text text-transparent mb-2">VANT-SIEM</h1>
      <p class="text-sm dark:text-surface-400 text-surface-500">Vigilance And Neutralization of Threats<br/>Security Information & Event Management</p>
    </div>

    {% if messages %}
    <div class="space-y-3 mb-6">
      {% for message in messages %}
      <div class="flex items-center gap-3 p-4 rounded-xl {% if message.tags == 'error' %}dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-300 bg-red-50 border-red-200 text-red-700{% else %}dark:bg-brand-500/10 dark:border-brand-500/20 dark:text-brand-300 bg-brand-50 border-brand-200 text-brand-700{% endif %} border" role="alert">
        <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-info-circle{% endif %}"></i>
        <span class="text-sm font-medium flex-1">{{ message }}</span>
        <button type="button" class="opacity-60 hover:opacity-100 transition-opacity" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" class="space-y-5">
      {% csrf_token %}
      <div>
        <label for="username" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
          <i class="fas fa-user mr-2 dark:text-brand-400 text-brand-600"></i>Usuario
        </label>
        <input type="text" name="username" id="username" class="input-field" placeholder="Ingrese su usuario" required autofocus>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">
          <i class="fas fa-lock mr-2 dark:text-brand-400 text-brand-600"></i>Contraseña
        </label>
        <input type="password" name="password" id="password" class="input-field" placeholder="Ingrese su contraseña" required>
      </div>
      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
      </button>
    </form>

    <div class="text-center mt-8 text-xs dark:text-surface-500 text-surface-400">
      &copy; 2026 VANT-SIEM Web v1.0 &middot; Todos los derechos reservados
    </div>
  </div>

  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.toggle("dark");
      localStorage.setItem("vant-theme", isDark ? "dark" : "light");
    }
  </script>
</body>
</html>
