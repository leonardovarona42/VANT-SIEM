{% extends "web_app/base.html" %}
{% block title %}Config: {{ agent.hostname|default:agent.agent_id }} | VANT-SIEM Web{% endblock %}

{% block content %}
<div class="mb-6">
  <a href="{% url 'web:agent-detail' agent.agent_id %}" class="text-sm dark:text-surface-400 text-surface-500 hover:text-brand-400 transition-colors"><i class="fas fa-arrow-left mr-1"></i>Volver al agente</a>
</div>

<div class="glass-card p-6 max-w-3xl">
  <div class="flex items-center gap-4 mb-6">
    <div class="w-12 h-12 rounded-xl dark:bg-brand-500/20 bg-brand-100 flex items-center justify-center">
      <i class="fas fa-cog text-brand-500 text-xl"></i>
    </div>
    <div>
      <h1 class="text-xl font-bold dark:text-white text-surface-900">Configuración del Agente</h1>
      <p class="text-sm dark:text-surface-400 text-surface-500">{{ agent.hostname|default:agent.agent_id }}</p>
    </div>
  </div>

  <div id="config-editor" class="mb-6">
    <label class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Configuración JSON</label>
    <textarea id="config-json" rows="16" class="w-full px-4 py-3 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:border-transparent font-mono text-xs">{
  "dlp_enabled": true,
  "log_level": "info",
  "heartbeat_interval": 60,
  "scan_enabled": true
}</textarea>
  </div>

  <div class="flex gap-3">
    <button onclick="sendConfig()" class="btn-primary text-sm"><i class="fas fa-paper-plane mr-2"></i>Enviar Configuración</button>
    <button onclick="formatJson()" class="btn-secondary text-sm"><i class="fas fa-code mr-2"></i>Formatear JSON</button>
  </div>

  <div id="config-result" class="mt-4 hidden">
    <div id="config-result-msg" class="p-4 rounded-xl text-sm"></div>
  </div>
</div>

<script>
function formatJson() {
  try {
    const ta = document.getElementById('config-json');
    const obj = JSON.parse(ta.value);
    ta.value = JSON.stringify(obj, null, 2);
  } catch(e) {
    alert('JSON inválido: ' + e.message);
  }
}

function sendConfig() {
  const ta = document.getElementById('config-json');
  const resultDiv = document.getElementById('config-result');
  const resultMsg = document.getElementById('config-result-msg');
  try {
    const config = JSON.parse(ta.value);
    fetch(window.location.href, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || '',
      },
      body: JSON.stringify({ config }),
    })
    .then(r => r.json())
    .then(data => {
      resultDiv.classList.remove('hidden');
      resultMsg.className = 'p-4 rounded-xl text-sm dark:bg-emerald-500/10 dark:border-emerald-500/20 dark:text-emerald-300 bg-emerald-50 border-emerald-200 text-emerald-700 border';
      resultMsg.textContent = data.message || 'Configuración enviada';
    })
    .catch(err => {
      resultDiv.classList.remove('hidden');
      resultMsg.className = 'p-4 rounded-xl text-sm dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-300 bg-red-50 border-red-200 text-red-700 border';
      resultMsg.textContent = 'Error al enviar: ' + err.message;
    });
  } catch(e) {
    resultDiv.classList.remove('hidden');
    resultMsg.className = 'p-4 rounded-xl text-sm dark:bg-red-500/10 dark:border-red-500/20 dark:text-red-300 bg-red-50 border-red-200 text-red-700 border';
    resultMsg.textContent = 'JSON inválido: ' + e.message;
  }
}
</script>
{% endblock %}
