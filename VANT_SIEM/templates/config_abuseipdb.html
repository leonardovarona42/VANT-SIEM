{% extends 'dashboard.html' %}
{% block content %}
<div class="container">
 <div class="row justify-content-center">
 <div class="col-md-8">
 <div class="card bg-secondary">
 <div class="card-header d-flex justify-content-between align-items-center">
 <h3 class="text-info mb-0"><i class="fas fa-network-wired me-2"></i>AbuseIPDB</h3>
 <a href="{% url 'analysis-services-hub' %}" class="btn btn-outline-light btn-sm"><i class="fas fa-arrow-left me-1"></i>Volver</a>
 </div>
 <div class="card-body">
 <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
 <div class="mb-3">
 <label class="form-label text-info">API Key</label>
 <input id="key" type="text" class="form-control" value="{{ cfg.abuseipdb_api_key|default:'' }}" placeholder="Key">
 </div>
 <div class="d-flex gap-2">
 <button class="btn btn-success" onclick="save()"><i class="fas fa-save me-1"></i>Guardar</button>
 <button class="btn btn-primary" onclick="test()"><i class="fas fa-vial me-1"></i>Test conexión</button>
 </div>
 </div>
 </div>
 </div>
 </div>
</div>
<script>
async function save(){
 const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
 const key = document.getElementById('key').value.trim();
 const res = await fetch('{% url "abuseipdb-config-save" %}', {method:'POST', headers:{'X-CSRFToken': csrftoken}, body: new URLSearchParams({abuseipdb_api_key:key})});
 const data = await res.json();
 alert(data.success ? 'Guardado' : 'Error');
}
async function test(){
 const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
 const res = await fetch('{% url "abuseipdb-test" %}', {method:'POST', headers:{'X-CSRFToken': csrftoken}});
 const data = await res.json();
 alert(data.success ? 'OK ('+data.status+')' : 'Error: '+(data.error||'falló'));
}
</script>
{% endblock %}
