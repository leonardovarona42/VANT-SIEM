{% extends 'dashboard.html' %}
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card bg-secondary">
        <div class="card-header"><h3 class="text-info mb-0"><i class="fas fa-signal me-2"></i>Prueba de conectividad (Ping)</h3></div>
        <div class="card-body">
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
          <div class="row g-2 mb-3 align-items-end">
            <div class="col-md-6">
              <label for="host" class="form-label text-info">Host o IP destino</label>
              <input id="host" class="form-control" placeholder="Ej: 8.8.8.8 o google.com">
            </div>
            <div class="col-md-2">
              <label for="count" class="form-label text-info">Cantidad de paquetes</label>
              <input id="count" type="number" min="1" max="10" value="4" class="form-control" placeholder="4">
            </div>
            <div class="col-md-2">
              <label for="timeout" class="form-label text-info">Timeout (segundos)</label>
              <input id="timeout" type="number" min="1" max="10" value="2" class="form-control" placeholder="2">
            </div>
            <div class="col-md-2">
              <button class="btn btn-primary w-100" onclick="runPing()"><i class="fas fa-play me-1"></i>Ejecutar</button>
            </div>
          </div>
          <label class="form-label text-info">Salida</label>
          <pre id="out" class="bg-dark text-light p-2 small" style="min-height: 200px;"></pre>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function runPing(){
  const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const body = new URLSearchParams({
    host: document.getElementById('host').value.trim(),
    count: document.getElementById('count').value,
    timeout: document.getElementById('timeout').value,
  });
  const res = await fetch('{% url "api-tools-ping" %}', {method:'POST', headers:{'X-CSRFToken': csrftoken}, body});
  const data = await res.json();
  document.getElementById('out').textContent = data.stdout || data.error || JSON.stringify(data);
}
</script>
{% endblock %}
