{% extends 'dashboard.html' %}
{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card bg-secondary">
        <div class="card-header"><h3 class="text-info mb-0"><i class="fas fa-route me-2"></i>Traceroute</h3></div>
        <div class="card-body">
          <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
          <div class="row g-2 mb-3 align-items-end">
            <div class="col-md-6">
              <label for="host" class="form-label text-info">Host o IP destino</label>
              <input id="host" class="form-control" placeholder="Ej: 8.8.8.8">
            </div>
            <div class="col-md-3">
              <label for="max_hops" class="form-label text-info">Máximo de saltos</label>
              <input id="max_hops" type="number" value="20" class="form-control" min="1" max="30">
            </div>
            <div class="col-md-3">
              <label for="timeout" class="form-label text-info">Timeout por salto (s)</label>
              <input id="timeout" type="number" value="2" class="form-control" min="1" max="10">
            </div>
          </div>
          <button class="btn btn-primary" onclick="runTrace()"><i class="fas fa-play me-1"></i>Ejecutar</button>
          <label class="form-label text-info mt-3">Salida</label>
          <pre id="out" class="bg-dark text-light p-2 small" style="min-height: 200px;"></pre>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function runTrace(){
  const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
  const body = new URLSearchParams({host: host.value.trim(), max_hops: max_hops.value, timeout: timeout.value});
  const res = await fetch('{% url "api-tools-traceroute" %}', {method:'POST', headers:{'X-CSRFToken': csrftoken}, body});
  const data = await res.json();
  out.textContent = data.stdout || data.error || JSON.stringify(data);
}
</script>
{% endblock %}
