{% extends 'dashboard.html' %}
{% block content %}
<div class="container">
 <div class="row justify-content-center">
 <div class="col-md-8">
 <div class="card bg-secondary">
 <div class="card-header"><h3 class="text-info mb-0"><i class="fas fa-plug me-2"></i>Escaneo de Puertos y Servicios (TCP)</h3></div>
 <div class="card-body">
 <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
 <div class="row g-2 mb-3 align-items-end">
 <div class="col-md-4">
 <label for="host" class="form-label text-info">Host o IP destino</label>
 <input id="host" class="form-control" placeholder="Ej: 192.168.1.10">
 </div>
 <div class="col-md-3">
 <label for="start" class="form-label text-info">Puerto inicial</label>
 <input id="start" type="number" class="form-control" value="1" min="1" max="65535" placeholder="1">
 </div>
 <div class="col-md-3">
 <label for="end" class="form-label text-info">Puerto final</label>
 <input id="end" type="number" class="form-control" value="1024" min="1" max="65535" placeholder="1024">
 </div>
 <div class="col-md-2">
 <button class="btn btn-primary w-100" onclick="runSvcScan()"><i class="fas fa-play me-1"></i>Escanear</button>
 </div>
 </div>
 <label class="form-label text-info">Resultados</label>
 <div class="table-responsive">
 <table class="table table-dark table-striped" id="tbl"><thead><tr><th>Puerto</th><th>Servicio</th><th>Banner</th></tr></thead><tbody></tbody></table>
 </div>
 </div>
 </div>
 </div>
 </div>
</div>
<script>
async function runSvcScan(){
 const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
 const body = new URLSearchParams({host: host.value.trim(), start: start.value, end: end.value});
 const res = await fetch('{% url "api-tools-service-scan" %}', {method:'POST', headers:{'X-CSRFToken': csrftoken}, body});
 const data = await res.json();
 const tb = document.querySelector('#tbl tbody'); tb.innerHTML='';
 if (data.success){ (data.open||[]).forEach(x=>{ const tr=document.createElement('tr'); tr.innerHTML = `<td>${x.port}</td><td>${x.service||''}</td><td><pre class='bg-dark text-light small m-0'>${(x.banner||'').replace(/</g,'&lt;')}</pre></td>`; tb.appendChild(tr); }); }
}
</script>
{% endblock %}
