{% extends "dashboard.html" %}
{% block title %}Cambiar Contrasena | VANT-SIEM{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card bg-secondary shadow">
            <div class="card-header text-center text-info fw-bold">
                Cambiar Contrasena
            </div>
            <div class="card-body">
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="old_password" class="form-label fw-bold text-info">Contrasena Actual</label>
                        <input type="password" name="old_password" id="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="new_password1" class="form-label fw-bold text-info">Nueva Contrasena</label>
                        <input type="password" name="new_password1" id="new_password1" class="form-control" required minlength="8">
                        <div class="form-text text-light">Minimo 8 caracteres</div>
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label fw-bold text-info">Confirmar Nueva Contrasena</label>
                        <input type="password" name="new_password2" id="new_password2" class="form-control" required>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'dashboard' %}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Cambiar Contrasena</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
