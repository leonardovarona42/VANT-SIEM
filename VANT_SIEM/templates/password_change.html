{% extends "dashboard.html" %}
{% block title %}Cambiar Contrasena | VANT-SIEM{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-md">
    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="px-6 py-4 border-b dark:border-surface-700 border-surface-200 text-center">
        <h3 class="text-xl font-bold dark:text-surface-100 text-surface-900">
          <i class="fas fa-key me-2 text-brand-500"></i>Cambiar Contrasena
        </h3>
      </div>
      <div class="p-6">
        {% if messages %}
        {% for message in messages %}
        <div class="mb-4 p-4 rounded-xl {% if message.tags == 'success' %}dark:bg-emerald-500/20 bg-emerald-100 text-emerald-400 border border-emerald-500/30{% elif message.tags == 'error' %}dark:bg-red-500/20 bg-red-100 text-red-400 border border-red-500/30{% else %}dark:bg-brand-500/20 bg-brand-100 text-brand-400 border border-brand-500/30{% endif %} flex items-center justify-between">
          <span>{{ message }}</span>
          <button onclick="this.parentElement.remove()" class="hover:opacity-70 transition-opacity">
            <i class="fas fa-times"></i>
          </button>
        </div>
        {% endfor %}
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-4">
            <label for="old_password" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Contrasena Actual</label>
            <input type="password" name="old_password" id="old_password" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required>
          </div>
          <div class="mb-4">
            <label for="new_password1" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Nueva Contrasena</label>
            <input type="password" name="new_password1" id="new_password1" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required minlength="8">
            <p class="mt-1 text-xs dark:text-surface-400 text-surface-500">Minimo 8 caracteres</p>
          </div>
          <div class="mb-6">
            <label for="new_password2" class="block text-sm font-medium dark:text-surface-300 text-surface-600 mb-2">Confirmar Nueva Contrasena</label>
            <input type="password" name="new_password2" id="new_password2" class="w-full px-4 py-2.5 text-sm dark:bg-surface-800 dark:border-surface-700 dark:text-surface-200 bg-surface-100 border-surface-200 text-surface-800 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent" required>
          </div>
          <div class="flex items-center justify-end gap-3">
            <a href="{% url 'dashboard' %}" class="px-4 py-2.5 dark:bg-surface-800 dark:hover:bg-surface-700 dark:text-surface-200 dark:border-surface-700 bg-surface-100 hover:bg-surface-200 text-surface-800 border-surface-200 font-medium rounded-xl transition-all duration-200">Cancelar</a>
            <button type="submit" class="px-4 py-2.5 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-medium rounded-xl shadow-lg shadow-brand-500/25 hover:shadow-brand-500/40 transition-all duration-300 inline-flex items-center gap-2">
              <i class="fas fa-save"></i>Cambiar Contrasena
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
